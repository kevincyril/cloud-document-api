# Preparation only. Creating a Blueprint in Render starts a deployment.
services:
  - type: web
    name: cloud-document-api
    runtime: node
    plan: free
    autoDeployTrigger: off
    buildCommand: npm ci --include=dev && npm run build && npm run db:migrate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DB_SSL
        value: "true"
      - key: STORAGE_DRIVER
        value: supabase
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: documents
